# =============================================================================
#  勒索主窗口排版（Ransom_dev）
#
#  改完这个文件**不用重新编译**，直接看效果：
#
#      Ransom_dev\x64\Debug\Ransom_dev.exe --ui-preview out.png --ui-grid
#
#  --ui-grid 会叠一层 20px 网格 + 每 100px 的坐标标注，方便你读坐标。
#  去掉 --ui-grid 就是干净的成品图。
#
#  ---- 坐标怎么算 ----
#  所有 rect 都是「x, y, 宽, 高」，单位像素，原点是**窗口内容区的左上角**。
#  内容区不含阴影和标题栏，所以 (0,0) 就是红底的左上角。
#
#  ---- 元素顺序 ----
#  按出现顺序绘制，后面的压在前面上。
#  整窗底色**不用**写成元素——上面 [window] 的 bg 会自动铺满整个内容区。
#
#  ---- 三种元素 ----
#    kind = rect    纯色块。需要 rect、color；可选 border / borderw
#    kind = image   贴图，**拉伸填满** rect（不保持宽高比）。
#                   需要 file、rect。file 是 assets\image\ 下的文件名。
#    kind = text    文字。需要 text、rect、size；可选 color / bold / lineh /
#                   align(left|center|right) / font(mono|ui)
#
#  ---- text 里的标记 ----
#    \n             换行
#    {cR,G,B}       从这里开始换色
#    {gold}         已收集金币        {goal}  目标金币
#    {left}         还差多少           {time}  剩余时间 MM:SS
#    {pct}          百分比
# =============================================================================

[window]
width  = 480            # **设计坐标系**尺寸 —— 下面所有元素坐标都按这套写
height = 340
scale  = 0.75           # 窗口实际大小 = 设计尺寸 x scale。0.5 = 缩到一半
bg     = 250,0,0        # 整窗底色（想要更亮的纯红就写 255,0,0）


# ---- 1) 左上角：A90 的头（用攻击前那张贴图）---------------------------------
#  keep = 1：付完钱后窗口飞向屏幕中心那一段，**只有它**还留着
#  （其它元素全部隐去，底色强制变黑）。
[element]
kind  = image
file  = A-90_IDLE.png
rect  = 10,16,150,150
keep  = 1


# ---- 2) 旁边：白字标题 ------------------------------------------------------
[element]
kind  = text
text  = YOUR ITEMS\nHAVE BEEN\nENCRYPTED
rect  = 200,16,420,100
size  = 30
bold  = 1
color = 255,255,255
lineh = 1.1
font  = mono


# ---- 3) 中间：黑块 + 白边框，正文后半段转纯红 --------------------------------
[element]
kind    = rect
rect    = 20,136,440,108
color   = 0,0,0
border  = 255,255,255
borderw = 2

[element]
kind  = text
text  = IF YOU DO NOT PAY THIS RANSOM\nBEFORE THE TIMER ENDS, YOUR ITEMS\nWILL BE {c255,0,0}UNRECOVERABLE BY ANY\nMEANS.
rect  = 86,148,508,90
size  = 16.5
color = 255,255,255
lineh = 1.35
font  = mono


# ---- 4) 左下：黑块 + 金币黄边框，显示还差多少金币 + Gold_icon ---------------
[element]
kind    = rect
rect    = 25,258,150,64
color   = 0,0,0
border  = 255,190,0
borderw = 2

[element]
kind  = image
file  = Gold_icon.png
rect  = 125,270,40,40

[element]
kind  = text
text  = {left}
rect  = 50,269,170,40
size  = 35
bold  = 1
color = 255,190,0
font  = mono


# ---- 5) 右下：红块 + 白边框，黑字 TIME --------------------------------------
[element]
kind    = rect
rect    = 200,258,260,64
color   = 215,0,0
border  = 255,255,255
borderw = 2

[element]
kind  = text
text  = TIME:  {time}
rect  = 210,269,242,36
size  = 35
bold  = 1
color = 0,0,0
font  = mono
