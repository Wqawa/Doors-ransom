# =============================================================================
#  付完钱那套窗口的排版（Ransom_dev）
#
#  这一整套只在**付清赎金**时出现，时序由 popup 控制：
#
#      1. 主窗口只留 A90 的头 + 黑底，弧线飞向屏幕中心
#         同时缩放到下面 [window] 算出来的大小
#      2. 到达后切换到本排版 -> 底色/背景变成 payup_bg.png
#      3. Accepta90 从小到大出场（popin=100），同时播 ransom_success
#      4. Thankyou_sign 紧随其后出场（popin=650）
#      5. 停留片刻后用**原本的关闭动画**收场
#
#  坐标、颜色、字体规则和 main_window.ini 完全一样。
#  多出来的两个键：
#      popin   = 毫秒      进入本排版后等这么久才开始「从小到大淡入」
#      popinms = 毫秒      出场动画时长（默认 420）
#
#  预览：Ransom_dev.exe --ui-preview payup.png --payup
# =============================================================================

[window]
width  = 498            # 设计坐标系 = payup_bg.png 的原始尺寸，所以贴图能 1:1 铺满
height = 279
scale  = 1.0
bg     = 0,0,0          # 背景图没盖到的地方用黑


# ---- 1) 背景图：整张铺满 -----------------------------------------------------
[element]
kind  = image
file  = payup_bg.png
rect  = 0,0,498,279


# ---- 2) 上方：Thankyou_sign（第二个出场，所以 popin 更大）--------------------
[element]
kind    = image
file    = Thankyou_sign.png
rect    = 62,18,374,46
popin   = 650
popinms = 450


# ---- 3) 中间：Accepta90（第一个出场，同时播 ransom_success）------------------
#  rect 的最后两个数是宽高，想再小/大就改它们（改完记得让它在窗口里居中）
[element]
kind    = image
file    = Accepta90.png
rect    = 174,88,150,150
popin   = 100
popinms = 450
