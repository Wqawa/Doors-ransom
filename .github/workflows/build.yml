# ============================================================================
#  build.yml —— 在 GitHub 云端（Windows Server 2025 + Visual Studio 2026）编译
#
#  一次运行做五件事，产物分两趟进仓库：
#    1. 用 MSBuild 编译 Release|Win32 与 Release|x64 两个配置
#       （平台名只能是 Win32 —— 见 Ransom_dev.vcxproj 里 OutputLayout 的注释；
#        产物目录由工程算成 build\x32\ 与 build\x64\）
#    2. 自测：把两个产物用【全部命令行参数】各跑一遍（tools\selftest.ps1），
#       渲染出 PNG + 真实桌面截屏，并收一份 selftest-report.md
#    3. 【第一趟，先】把两个产物重命名后放进 output\<编译完成时间>\ 并立刻提交。
#       刻意排在打包之前：万一后面打包出岔子，exe 已经安全落地了。
#         Ransom_dev_x32.exe   <- build\x32\Release\Ransom_dev.exe
#         Ransom_dev_x64.exe   <- build\x64\Release\Ransom_dev.exe
#       同时写一份 build-info.txt（时间、提交、哈希）和一份 selftest-report.md。
#    4. 【第二趟，后】把测试产物打成高压缩比的包，放进同一个
#       output\<编译完成时间>\ 里，再提交一次：
#         output\<时间戳>\selftest-screenshots.7z   截图树
#         output\<时间戳>\selftest-logs.7z          诊断日志
#       包内路径和 selftest\ 下的相对路径逐字一致，解出来就是原样的一棵树：
#         screenshots\interactive\x64\<用例>\desktop-1200ms.png
#         x64\screen-<用例>\diag.log
#    5. 两个 exe 和两个压缩包都挂一份到这次 run 的 Artifacts 上，不用 clone 就能下。
#
#  为什么默认 7z 而不是 zip（拿本仓库的真实截图量过）：122 张 PNG 共 27.8 MB，
#  「7z -mx=9」压到 17.3 MB（62.2%），「zip -mx=9」只能到 27.1 MB（97.4%）。
#  deflate 不跨文件找冗余，而连拍的相邻帧几乎一样，7z 的固实压缩吃得到这份红利。
#  要 zip 就手动跑 workflow 时把 archive_format 填 zip。
#
#  步骤顺序是刻意的：自测放在"收集产物"之前，产物收集放在"提交"之前，
#  而"让 job 变红"放在最后 —— 这样即使自测挂了，产物和截图也一定能上传出去，
#  不会出现"程序有问题 -> runner 直接销毁 -> 什么都看不到"。
#
#  触发方式：
#    - 手动：仓库 Actions 页面 -> Build -> Run workflow
#    - 推送：任何推到 main、且不只改 output\ 的提交
#
#  为什么不会自己套自己：产物提交只动 output\，而 push 触发器用 paths-ignore
#  把 output\ 排除了；提交信息里再带一个 [skip ci] 兜底。
#
#  镜像为什么钉死在 windows-2025-vs2026：工程文件里的工具集是 v145，那是
#  Visual Studio 2026（18.x）的；windows-latest 上只有 VS2022 的 v143，
#  编不了 v145。这个镜像 2026-05 起已 GA，VS 2026 18.5。
#  万一以后要用 VS2022 编，把下面 runs-on 换成 windows-latest 并给 msbuild
#  加一个 /p:PlatformToolset=v143 即可（C++20 部分 v143 同样支持）。
# ============================================================================

name: Build

on:
  workflow_dispatch:
    inputs:
      keep_last:
        description: '只保留最近 N 份产物（0 = 全部保留，不删任何东西）'
        required: false
        default: '0'
      archive_format:
        description: '测试产物的压缩格式：7z（压缩率高得多，默认）或 zip（到处都能解）'
        required: false
        default: '7z'
      commit_raw_screenshots:
        description: '除了压缩包，再提交一份解压好的截图文件夹（1 = 是；默认 0，只有压缩包进仓库）'
        required: false
        default: '0'
      commit_logs:
        description: '把诊断日志(diag.log)单独打成一个压缩包一起提交（1 = 是，默认 1）'
        required: false
        default: '1'
  push:
    branches: [ main ]
    paths-ignore:
      - 'output/**'

# 推产物回仓库需要写权限；其余权限一律不给
permissions:
  contents: write

# 同一分支上的构建排队执行，避免两个 job 同时往 main 推产物打架
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  KEEP_LAST: ${{ github.event.inputs.keep_last || '0' }}
  ARCHIVE_FORMAT: ${{ github.event.inputs.archive_format || '7z' }}
  COMMIT_RAW_SCREENSHOTS: ${{ github.event.inputs.commit_raw_screenshots || '0' }}
  COMMIT_LOGS: ${{ github.event.inputs.commit_logs || '1' }}

jobs:
  build:
    name: Release x86 + x64
    runs-on: windows-2025-vs2026

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 MSBuild
        uses: microsoft/setup-msbuild@v3

      # ----------------------------------------------------------------------
      # 1. 编译两个平台
      #    直接编 .vcxproj 而不是 .sln：工程里 OutputLayout 是锚在
      #    $(MSBuildThisFileDirectory) 上的，两种编法产物都落在 build\ 下。
      # ----------------------------------------------------------------------
      - name: 编译 Release|Win32 与 Release|x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mb = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
          if (-not $mb) { throw 'PATH 上找不到 msbuild，setup-msbuild 这步可能没生效' }
          Write-Host "MSBuild: $mb"
          msbuild -version

          # 平台名必须写 MSBuild 认识的 Win32：VS 的 C++ 构建系统只认
          # $(VCTargetsPath)\Platforms\ 下的 Win32 和 x64 两个目录，传 x32
          # 会直接撞 error MSB8003: The PlatformToolset property is not defined。
          # 产物目录不靠平台名 —— 由 vcxproj 的 OutputLayout 算成 build\x32\。
          foreach ($p in 'Win32', 'x64') {
            Write-Host "===== MSBuild Release|$p ====="
            msbuild Ransom_dev\Ransom_dev.vcxproj /p:Configuration=Release /p:Platform=$p /m /v:minimal /nologo
            if ($LASTEXITCODE -ne 0) { throw "MSBuild Release|$p 失败，退出码 $LASTEXITCODE" }
          }

      # ----------------------------------------------------------------------
      # 2. 自测：两个产物 × 全部命令行参数
      #    具体用例矩阵在 tools\selftest.ps1 里，分成两类：
      #      [A] 自己"导完就退出"的模式（--ui-preview / --setup-ui / --fx-dump /
      #          --face-dump / --audio-dump / --theme-dump / --clean-gold /
      #          --restore / --pay ...）—— 有明确退出码，直接断言。
      #      [B] 开窗后挂在消息循环里的模式（--face-demo / --phase）—— 永远
      #          不自己退，只能定时截屏再强杀。跑这类必须带 --no-guardian
      #          （否则强杀会被看门狗判成"被强杀"再演一场惩罚）和 --no-lockdown。
      #
      #    这步故意用 continue-on-error：脚本自己内部已经判定了每个用例的
      #    通过与否，并把失败写进 selftest-report.md / ::error 注解。这里不让
      #    它立刻中断 job，是为了让后面的"收集产物"和"上传截图"照常跑到 ——
      #    runner 一销毁，证据就没了。真正的"变红"放在最后一步，等一切都传完。
      # ----------------------------------------------------------------------
      - name: 自测（全部命令行参数 + 截图）
        id: selftest
        shell: pwsh
        continue-on-error: true
        run: |
          # 不加 -AllowFailures：脚本有失败就如实 exit 1。
          # 这是刻意让 outcome='failure'，好让最后那步判定整个 job 失败。
          # 而 continue-on-error 保证 job 不会当场中断，后面的产物收集和
          # 截图上传照常跑完。
          pwsh -NoProfile -File tools\selftest.ps1 -OutDir selftest

      # ----------------------------------------------------------------------
      # 3. 收集产物到 output\<编译完成时间>\
      #    时间在这一步才取 —— 构建已经成功之后，所以它就是"编译完成时间"。
      # ----------------------------------------------------------------------
      - name: 收集产物到 output\
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 北京时间（UTC+8）。万一镜像里没有这个时区 id，退回 UTC 而不是崩。
          try {
            $done = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([datetime]::UtcNow, 'China Standard Time')
            $tz   = '北京时间 UTC+8'
          } catch {
            $done = [datetime]::UtcNow
            $tz   = 'UTC'
          }
          $stamp = $done.ToString('yyyy-MM-dd_HHmmss')
          $dir   = Join-Path 'output' $stamp
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $map = [ordered]@{
            'Ransom_dev_x32.exe' = 'build\x32\Release\Ransom_dev.exe'
            'Ransom_dev_x64.exe' = 'build\x64\Release\Ransom_dev.exe'
          }

          $rows = @()
          foreach ($dst in $map.Keys) {
            $src = $map[$dst]
            if (-not (Test-Path -LiteralPath $src)) { throw "找不到产物：$src" }
            $target = Join-Path $dir $dst
            Copy-Item -LiteralPath $src -Destination $target -Force
            $f   = Get-Item -LiteralPath $target
            $sha = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLower()
            $rows += ('{0}  {1:N0} bytes  SHA256 {2}' -f $dst, $f.Length, $sha)
            Write-Host ("  {0}  {1:N0} bytes" -f $dst, $f.Length)
          }

          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $info = @(
            "编译完成时间 ($tz): $($done.ToString('yyyy-MM-dd HH:mm:ss'))"
            "编译完成时间 (UTC):      $([datetime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))"
            "仓库:                    $env:GITHUB_REPOSITORY"
            "分支:                    $env:GITHUB_REF_NAME"
            "提交:                    $env:GITHUB_SHA"
            "触发者:                  $env:GITHUB_ACTOR"
            "工作流运行:              #$env:GITHUB_RUN_NUMBER (id $env:GITHUB_RUN_ID)"
            "运行页面:                $url"
            ""
            "产物："
          ) + ($rows | ForEach-Object { "  $_" })

          Set-Content -LiteralPath (Join-Path $dir 'build-info.txt') -Value $info -Encoding utf8

          # 自测报告跟着产物一起归档（纯文本，几十 KB）。
          if (Test-Path -LiteralPath 'selftest\selftest-report.md') {
            Copy-Item -LiteralPath 'selftest\selftest-report.md' `
                      -Destination (Join-Path $dir 'selftest-report.md') -Force
            Write-Host '  已附上 selftest-report.md'
          } else {
            Write-Host '::warning title=缺少自测报告::没找到 selftest\selftest-report.md'
          }

          # 截图默认不再以散文件进仓库 —— 下一趟会把它们整个打成 7z。
          # 只有 commit_raw_screenshots=1 时才顺手也放一份解压好的，
          # 方便直接在 GitHub 网页上逐张翻（代价是仓库里多 26 MB 散文件）。
          if ($env:COMMIT_RAW_SCREENSHOTS -eq '1') {
            if (Test-Path -LiteralPath 'selftest\screenshots') {
              $shotsDir = Join-Path $dir 'screenshots'
              Copy-Item -LiteralPath 'selftest\screenshots' -Destination $shotsDir -Recurse -Force
              $png  = @(Get-ChildItem -LiteralPath $shotsDir -Filter '*.png' -File -Recurse)
              $size = ($png | Measure-Object -Property Length -Sum).Sum
              Write-Host ("  已附上解压好的截图：{0} 张 / {1:N0} bytes" -f $png.Count, $size)
            } else {
              Write-Host '::warning title=缺少截图目录::没找到 selftest\screenshots'
            }
          }

          # 可选的清理：只留最近 N 份（默认 0 = 一份都不删）
          $keep = 0
          if ($env:KEEP_LAST -and $env:KEEP_LAST -match '^\d+$') { $keep = [int]$env:KEEP_LAST }
          if ($keep -gt 0) {
            $old = Get-ChildItem -LiteralPath 'output' -Directory |
                   Sort-Object Name -Descending | Select-Object -Skip $keep
            foreach ($d in $old) {
              Write-Host "超过 keep_last=$keep，删除旧产物：$($d.Name)"
              Remove-Item -LiteralPath $d.FullName -Recurse -Force
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "stamp=$stamp"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dir=$dir"

      # ----------------------------------------------------------------------
      # 4. 第一趟提交：两个 exe + build-info.txt + selftest-report.md
      #    只 git add output —— 构建过程会重写 Ransom_dev\assets_gen.rc / .txt
      #    （gen_assets.ps1 按内容比对，checkout 出的 LF 和它写的 CRLF 不同），
      #    那些是构建副产物，不该混进产物提交里。
      # ----------------------------------------------------------------------
      - name: 提交并推送产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- 'output'
          $staged = git status --porcelain -- output
          if (-not $staged) {
            Write-Host 'output\ 没有变化，跳过提交'
            exit 0
          }

          git commit -m "build: ${{ steps.package.outputs.stamp }} (run #${{ github.run_number }}) [skip ci]"

          # 万一有人同时在往 main 推，rebase 后重试，不要直接失败
          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "push 失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin $env:GITHUB_REF_NAME
          }
          if (-not $pushed) { throw '推送产物失败：连续 3 次都没推上去' }

      # ----------------------------------------------------------------------
      # 5. 打包测试产物（第二趟的开始）
      #    打包就地在 selftest\ 里做（Push-Location），所以包内路径和 selftest\
      #    下的相对路径逐字一致，解出来就是原样的一棵树。
      #    日志那份要先收拢：diag.log 散在各用例目录里，按原相对路径复制到
      #    暂存目录再打包，包内才看得出哪条日志属于哪个用例。
      #    continue-on-error：打包挂了也要让后面的 Artifact 上传跑到，
      #    变红放在最后一步统一判。
      # ----------------------------------------------------------------------
      - name: 打包测试产物（截图 + 诊断日志）
        id: pack
        if: always() && steps.package.outputs.dir != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirAbs = (Resolve-Path -LiteralPath '${{ steps.package.outputs.dir }}').Path

          # 找 7z。GitHub 的 Windows 镜像预装了 7-Zip，但 PATH 上不一定有，
          # 所以按「PATH -> Program Files -> Program Files (x86) -> chocolatey」挨个找。
          $sevenZip = $null
          $onPath = Get-Command 7z -ErrorAction SilentlyContinue
          if ($onPath) { $sevenZip = $onPath.Source }
          if (-not $sevenZip) {
            $candidates = @()
            if ($env:ProgramFiles)        { $candidates += (Join-Path $env:ProgramFiles '7-Zip\7z.exe') }
            if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe') }
            $candidates += 'C:\ProgramData\chocolatey\bin\7z.exe'
            foreach ($c in $candidates) {
              if (Test-Path -LiteralPath $c) { $sevenZip = $c; break }
            }
          }

          $fmt = if ($env:ARCHIVE_FORMAT -eq 'zip') { 'zip' } else { '7z' }
          if ($fmt -eq '7z' -and -not $sevenZip) {
            Write-Host '::warning title=找不到 7z::退回 zip —— PNG 用 deflate 几乎压不动（实测只省 2.6%）'
            $fmt = 'zip'
          }
          Write-Host "压缩格式: $fmt"
          if ($sevenZip) { Write-Host "7-Zip:    $sevenZip" }

          function New-Pack {
            param([string]$Work, [string[]]$Items, [string]$Name)
            $out = Join-Path $dirAbs "$Name.$fmt"
            if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Force }
            Push-Location -LiteralPath $Work
            try {
              if ($fmt -eq '7z') {
                # -mx=9 最高压缩；-mmt=on 多线程；-bso0 -bsp0 关掉 7z 自己的输出
                & $sevenZip a -t7z -mx=9 -mmt=on -bso0 -bsp0 $out @Items
                if ($LASTEXITCODE -ne 0) { throw "7z 打包 $Name 失败，退出码 $LASTEXITCODE" }
              } else {
                Compress-Archive -Path $Items -DestinationPath $out -CompressionLevel Optimal -Force
              }
            } finally {
              Pop-Location
            }
            if (-not (Test-Path -LiteralPath $out)) { throw "打包 $Name 之后找不到 $out" }
            return $out
          }

          function Show-Pack {
            param([string]$Label, [string]$Out, [int]$RawCount, [long]$RawBytes)
            $f   = Get-Item -LiteralPath $Out
            $pct = if ($RawBytes -gt 0) { $f.Length * 100.0 / $RawBytes } else { 0 }
            Write-Host ("  {0,-20} {1,4} 个文件 {2,12:N0} bytes  ->  {3,12:N0} bytes  ({4:N1}%)" -f `
                        $Label, $RawCount, $RawBytes, $f.Length, $pct)
          }

          $made = 0

          # --- 测试产物：截图树（screenshots\<类别>\<架构>\<用例>\*.png）---
          if (Test-Path -LiteralPath 'selftest\screenshots') {
            $raw = Get-ChildItem -LiteralPath 'selftest\screenshots' -File -Recurse |
                   Measure-Object -Property Length -Sum
            $out = New-Pack -Work 'selftest' -Items @('screenshots') -Name 'selftest-screenshots'
            Show-Pack -Label 'selftest-screenshots' -Out $out -RawCount $raw.Count -RawBytes $raw.Sum
            $made++
          } else {
            Write-Host '::warning title=缺少截图目录::没找到 selftest\screenshots，跳过截图打包'
          }

          # --- 诊断日志：先按原相对路径收拢，再打包 ---
          if ($env:COMMIT_LOGS -ne '1') {
            Write-Host 'commit_logs != 1，跳过诊断日志打包'
          } elseif (-not (Test-Path -LiteralPath 'selftest')) {
            Write-Host '::warning title=缺少自测目录::没找到 selftest\，跳过日志打包'
          } else {
            $root  = (Resolve-Path -LiteralPath 'selftest').Path
            $stage = Join-Path $env:RUNNER_TEMP 'selftest-logs'
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            $n = 0
            foreach ($log in Get-ChildItem -LiteralPath 'selftest' -Filter 'diag.log' -File -Recurse) {
              # 相对 selftest\ 的原路径，例如 x64\screen-phase-1-face\diag.log
              $rel = $log.FullName.Substring($root.Length).TrimStart('\', '/')
              $dst = Join-Path $stage $rel
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dst) | Out-Null
              Copy-Item -LiteralPath $log.FullName -Destination $dst -Force
              $n++
            }

            if ($n -eq 0) {
              Write-Host '::warning title=没有诊断日志::selftest\ 下一个 diag.log 都没找到'
            } else {
              $raw = Get-ChildItem -LiteralPath $stage -File -Recurse | Measure-Object -Property Length -Sum
              # 在 stage 里用 '*' 打包，包内路径才等于 selftest\ 下的相对路径
              $out = New-Pack -Work $stage -Items @('*') -Name 'selftest-logs'
              Show-Pack -Label 'selftest-logs' -Out $out -RawCount $raw.Count -RawBytes $raw.Sum
              $made++
            }
          }

          if ($made -eq 0) { Write-Host '::warning title=没打包出任何东西::'; exit 0 }
          Write-Host "打包完成：$made 个压缩包，已放进 $dirAbs"

      # ----------------------------------------------------------------------
      # 6. 第二趟提交：只推压缩包
      #    第一趟已经把两个 exe 推上去了，这一步才是体积大的测试产物。
      #    分成两趟是因为打包要压几十 MB，慢；exe 先落地更稳。
      # ----------------------------------------------------------------------
      - name: 提交并推送压缩包
        if: always() && steps.package.outputs.dir != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- 'output'
          $staged = git status --porcelain -- output
          if (-not $staged) {
            Write-Host 'output\ 没有新东西，跳过第二趟提交'
            exit 0
          }
          Write-Host '待提交：'
          $staged | ForEach-Object { Write-Host "  $_" }

          git commit -m "build: ${{ steps.package.outputs.stamp }} 测试产物压缩包 (run #${{ github.run_number }}) [skip ci]"

          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "push 失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin $env:GITHUB_REF_NAME
          }
          if (-not $pushed) { throw '推送压缩包失败：连续 3 次都没推上去' }

      # 附带的便利：产物同时挂到这次 run 的 Artifacts 里，不用 clone 就能下载。
      # 这一条挂的是整个 output\<时间戳>\，所以两个 exe、报告、两个压缩包都在里面。
      # 放在两趟提交之后 —— 万一这步挂了，产物也已经进仓库了。
      # if: always() —— 自测失败也要传，否则证据全丢。dir 为空说明没走到收集那步。
      - name: 上传产物为运行产物（可下载）
        if: always() && steps.package.outputs.dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: Ransom_dev_${{ steps.package.outputs.stamp }}
          path: ${{ steps.package.outputs.dir }}
          retention-days: 30

      # 自测证据单独传一份，是解压好的原始文件（截图 + diag.log + 报告），
      # 不用先解仓库里那个 7z。独立成一条 Artifact 的好处：在 Actions 页面直接
      # 下载就能看到全部 PNG，不用为了几张图去 clone 整个 output\。
      - name: 上传自测截图与报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest_${{ steps.package.outputs.stamp || github.run_number }}
          path: selftest/
          if-no-files-found: warn
          retention-days: 30

      # ----------------------------------------------------------------------
      # 最后一步才让 job 变红
      #    刻意放在这里，而不是让"自测"那一步直接红：一红就停，runner 马上
      #    销毁，收集的产物和上传的截图就全都拿不到了。
      #    先让证据全部传完，最后再判定成败。
      #    continue-on-error 的步骤 outcome='failure'、conclusion='success'，
      #    所以这里按 outcome 判。
      # ----------------------------------------------------------------------
      - name: 自测或打包失败则判定整个 job 失败
        if: always() && (steps.selftest.outcome == 'failure' || steps.pack.outcome == 'failure')
        shell: pwsh
        run: |
          Write-Host '::error title=自测或打包未通过::自测详情见本页 job 摘要，或 selftest_* 这条 Artifact 里的 selftest-report.md；打包详情见上面「打包测试产物」那一步'
          exit 1
